name: vehicle_identification_number
description: "Project Flutter application for Vehicle Identification Number (VIN) detection using camera and ML models."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  camera: ^0.11.3
  camerawesome: ^2.4.0
  tflite_flutter: ^0.12.1
  image: ^4.5.4
  path_provider: ^2.1.5
  path: ^1.9.1
  hive_flutter: ^1.1.0
  device_info_plus: ^12.2.0
  file_picker: ^10.3.3
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/license_plate_detector_float16.tflite
    - assets/models/rec_model_float16.tflite
